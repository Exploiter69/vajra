name: Phase 14 Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/vajra/memory/**'
      - 'tests/memory/**'
      - 'docs/PHASE_14_*.md'
      - '.github/workflows/phase14-validation.yml'
  pull_request:
    paths:
      - 'src/vajra/memory/**'
      - 'tests/memory/**'
      - 'docs/PHASE_14_*.md'
      - '.github/workflows/phase14-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Phase 14 tests
        run: PYTHONPATH=src pytest -q tests/memory
      - name: Portable full suite
        run: PYTHONPATH=src pytest -q -k 'not gvisor_integration'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Diff check
        run: git diff --check
