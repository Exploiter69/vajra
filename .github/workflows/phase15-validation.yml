name: Phase 15 Validation

on:
  push:
    paths:
      - "src/vajra/hardening/**"
      - "src/vajra/sandbox/**"
      - "src/vajra/control/worktree.py"
      - "src/vajra/routing/gateway.py"
      - "tests/hardening/**"
      - ".github/workflows/phase15-validation.yml"
      - "docs/PHASE_15_*"
  pull_request:
    paths:
      - "src/vajra/hardening/**"
      - "src/vajra/sandbox/**"
      - "src/vajra/control/worktree.py"
      - "src/vajra/routing/gateway.py"
      - "tests/hardening/**"
      - ".github/workflows/phase15-validation.yml"
      - "docs/PHASE_15_*"
  workflow_dispatch:

jobs:
  phase15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Phase 15 tests
        run: PYTHONPATH=src pytest -q tests/hardening
      - name: Portable full suite
        run: PYTHONPATH=src pytest -q -k 'not gvisor_integration'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Diff check
        run: git diff --check
