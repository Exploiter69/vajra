name: VAJRA Phase 17 Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Phase 17 tests
        run: PYTHONPATH=src pytest -q tests/self_improvement/test_phase17_self_improvement.py
      - name: Portable full suite
        run: PYTHONPATH=src pytest -q -k 'not gvisor_integration'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Diff check
        run: git diff --check
